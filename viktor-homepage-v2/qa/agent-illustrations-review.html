<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Six agent illustrations — review</title>
<link rel="stylesheet" href="../agent-illustrations.css?rev=fidelity-1">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;font-family:Inter,Arial,sans-serif;background:#f2f6ff;color:#172b4d}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1500px;margin:auto}h2{font-size:16px;margin:0 0 8px}article{min-width:0}a{color:#0066ff}.agent-illustration{height:420px}</style></head>
<body><main id="review"></main><script src="../agent-illustrations.js?rev=fidelity-1"></script><script>
const names=['Strategy Readiness','OKR Drafting','Alignment Analysis','Check-in Drafting','Engagement Report','Retrospective Prep'];
names.forEach((name,i)=>{const article=document.createElement('article');article.innerHTML='<h2>'+name+'</h2><div class="agent-illustration" role="img"></div>';review.append(article);renderAgentIllustration(i,article.lastElementChild);});
document.querySelectorAll('img').forEach(el=>el.setAttribute('src','../'+el.getAttribute('src')));
</script></body></html>
