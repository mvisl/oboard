.work{height:364px}

.result{padding-bottom:20px}
.result-action{display:flex;margin-top:24px;padding:10px 16px;justify-content:space-between;gap:24px}

.work{height:auto;min-height:306px}

function render(index){const a=agents[index],focus=a.rows[0];selected=index;tabs.forEach((t,i)=>t.setAttribute('aria-selected',String(i===index)));syncGeometry(index);refs.workIcon.src=iconBase+a.icon;refs.workName.textContent=a.name;refs.workDesc.textContent=a.desc;refs.workMeta.innerHTML=a.meta;refs.resultKicker.textContent=a.result;refs.resultTitle.textContent=a.sumTitle;refs.resultCopy.textContent=a.sum;refs.focusTitle.textContent=focus[0];refs.focusEvidence.textContent=focus[1];refs.focusAction.textContent=a.next+' →';refs.summaryTitle.textContent=a.sumTitle;refs.summaryCopy.textContent=a.sum;refs.statOneValue.textContent=a.s1;refs.statOneLabel.textContent=a.l1;refs.statTwoValue.textContent=a.s2;refs.statTwoLabel.textContent=a.l2;refs.secondaryAction.textContent=a.secondary;refs.primaryAction.textContent=a.primary;}
tabs.forEach((t,i)=>{t.addEventListener('mousedown',e=>e.preventDefault());t.addEventListener('click',()=>{const y=scrollY;render(i);requestAnimationFrame(()=>scrollTo(0,y));});});
addEventListener('resize',()=>syncGeometry(selected));
const renderOriginal=render;
render=function(index){renderOriginal(index);renderAgentIllustration(index);};
render(2);
</script>
