<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBoard — AI agents across the cycle</title>
<style>
:root{--ink:#090e20;--navy:#142246;--muted:#6b7791;--blue:#1268f3;--blue-2:#6c7cff;--violet:#8438e8;--line:#dbe4f1;--soft:#f2f6ff;--soft-2:#eaf2ff;--good:#0b9f6b;--risk:#ec721f;--shadow:0 18px 44px rgba(35,77,142,.08)}
*,*::before,*::after{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}
.page{width:100%;max-width:1392px;margin:auto;padding:64px 56px 56px}.brand{text-align:center;color:var(--blue);font-size:14px;font-weight:800;line-height:1.2;letter-spacing:.08em;text-transform:uppercase}.title{max-width:1100px;text-align:center;margin:20px auto 12px;font-size:56px;font-weight:800;line-height:1.04;letter-spacing:-.052em}.title span{color:var(--blue)}.lede{text-align:center;margin:0 auto;color:var(--muted);font-size:20px;line-height:1.35}
.cycle{position:relative;margin-top:40px;--connector-x:50%}.phase-track{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;height:54px}.phase-track:before{content:"";position:absolute;left:var(--line-start,8.333%);right:calc(100% - var(--line-end,91.667%));top:37px;height:3px;border-radius:999px;background:linear-gradient(90deg,#0877ff 0%,#7352f3 17%,#d63bc4 32%,#3864ff 49%,#9c46e8 66%,#e13cb4 82%,#1268f3 100%);box-shadow:0 2px 7px rgba(138,73,238,.22)}.phase{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:8px;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}.phase:nth-child(1){grid-column:1}.phase:nth-child(2){grid-column:2/span 2}.phase:nth-child(3){grid-column:4/span 2}.phase:nth-child(4){grid-column:6}.phase-num{font-weight:780}.phase-dot{position:absolute;left:50%;top:29px;width:18px;height:18px;border:2px solid var(--blue);background:white;border-radius:50%;transform:translateX(-50%);z-index:2}
.agents{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;position:relative}.agent{height:190px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px rgba(20,48,94,.055),0 1px 2px rgba(20,48,94,.04);transition:box-shadow .18s,background .18s,border-color .18s;position:relative;display:flex;flex-direction:column}.agent:hover{background:#fafcff;box-shadow:0 13px 26px rgba(20,48,94,.11),0 3px 7px rgba(20,48,94,.05)}.agent[aria-selected=true]{border-color:#6a9df8;background:#f5f8ff;box-shadow:0 12px 24px rgba(18,104,243,.14),0 3px 7px rgba(20,48,94,.06)}.agent-icon{width:34px;height:34px;border-radius:9px;background:#eaf2ff;display:grid;place-items:center;margin-bottom:11px;flex:none}.agent-icon img{width:21px;height:21px;filter:invert(36%) sepia(93%) saturate(3913%) hue-rotate(208deg) brightness(100%) contrast(91%)}.agent h2{margin:0 0 6px;font-size:17px;line-height:1.12;letter-spacing:-.02em}.agent p{margin:0;color:var(--muted);font-size:13px;line-height:1.32}.agent-tools{display:flex;align-items:center;gap:8px;min-height:25px;margin-top:auto;padding-top:10px}.agent-tools img{display:block;width:17px;height:17px;object-fit:contain}.agent-tools img.tool-oboard{width:19px;height:19px}.agent-tools img.tool-sparkle{width:18px;height:18px;filter:invert(43%) sepia(74%) saturate(2316%) hue-rotate(219deg) brightness(96%) contrast(95%)}
.connector{height:46px;position:relative}.connector:before{content:"";position:absolute;top:0;bottom:14px;width:2px;background:var(--blue);left:var(--connector-x);transform:translateX(-50%);transition:left .24s cubic-bezier(.2,.8,.2,1)}.connector:after{content:"";position:absolute;bottom:4px;width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid white;box-shadow:0 0 0 2px #bdd5ff;left:var(--connector-x);transform:translateX(-50%);transition:left .24s cubic-bezier(.2,.8,.2,1)}
.work{height:384px;border:1px solid #e1e9f5;border-radius:22px;background:linear-gradient(145deg,#eef5ff 0%,#f6f8ff 100%);padding:30px 32px;box-shadow:var(--shadow);overflow:hidden}.work-head{height:94px;display:flex;align-items:flex-start;gap:16px}.work-icon{width:62px;height:62px;border-radius:15px;background:#e3eeff;display:grid;place-items:center;flex:none}.work-icon img{width:36px;height:36px;filter:invert(36%) sepia(93%) saturate(3913%) hue-rotate(208deg) brightness(100%) contrast(91%)}.work-title{min-width:0}.agent-label{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.work-title h3{font-size:clamp(28px,2.3vw,32px);line-height:1.08;letter-spacing:-.035em;margin:4px 0}.work-title p{display:block;margin:0;color:var(--muted);font-size:17px}.work-meta{margin-left:auto;display:flex;align-items:center;gap:18px;text-align:right;color:var(--muted);font-size:14px;line-height:1.35}.rerun{border:1px solid #b8c9e5;background:#fff;color:#263b68;border-radius:10px;height:42px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer}.rerun:hover{border-color:var(--blue);color:var(--blue)}
.work-grid{height:214px;margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.result,.summary{background:#fff;border:1px solid #e1e7f0;border-radius:16px;overflow:hidden}.result{padding:22px 24px}.result-kicker,.summary-tag{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.result h4{max-width:800px;font-size:clamp(22px,1.8vw,24px);line-height:1.16;letter-spacing:-.025em;margin:7px 0 4px}.result>p{margin:0;color:var(--muted);font-size:16px;line-height:1.35}.result-action{margin-top:17px;padding:15px 24px;border-radius:12px;background:#f4f8ff;display:flex;align-items:center;justify-content:space-between;gap:18px}.result-action strong{display:block;font-size:15px}.result-action p{margin:3px 0 0;color:var(--muted);font-size:14px}.result-action b{color:var(--blue);font-size:15px;white-space:nowrap}.summary{padding:20px;display:flex;flex-direction:column}.summary-tag{display:block;margin-bottom:10px}.summary h4,.summary>p{display:none}.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;margin-top:auto;border:0;align-items:start}.stat{min-width:0;padding:0;white-space:normal;overflow:hidden}.stat+.stat{border-left:1px solid #e7edf6;padding-left:16px}.stat b{display:block;max-width:100%;font-size:24px;line-height:.95;color:#123885;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.stat span{display:block;max-width:100%;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}.action{height:42px;border-radius:10px;border:1px solid #9eb8e2;background:#fff;color:#17356e;font-size:14px;font-weight:760;cursor:pointer}.action#secondaryAction{display:none}.action.primary{border:0;color:#fff;background:linear-gradient(90deg,#1268f3,#8535e7)}.action:hover{filter:brightness(.98)}
.footer{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 0;color:var(--muted);font-size:12px}.footer a{color:var(--blue);font-size:13px;font-weight:760;text-decoration:none}
@media(max-width:1100px){.page{padding:38px 20px}.agents{grid-template-columns:repeat(3,1fr)}.agent{height:190px}.phase-track{display:none}.connector{display:none}.work{height:auto;margin-top:22px;padding:26px}.work-head{height:auto;min-height:94px}.work-grid{height:auto;margin-top:16px;grid-template-columns:minmax(0,1fr) 280px}.cycle{--active:0!important}}
@media(max-width:850px){.page{padding-top:40px}.title{font-size:42px}.lede{font-size:18px}}@media(max-width:720px){.agents{grid-template-columns:1fr 1fr}.agent{height:178px}.work{height:auto;padding:20px}.work-head{height:auto;min-height:0}.work-meta{display:none}.work-grid{height:auto;margin-top:18px;grid-template-columns:1fr}.result-action{align-items:flex-start;flex-direction:column}.result-action b{white-space:normal}.summary{min-height:0}.footer{gap:20px;align-items:flex-start}.footer a{text-align:right}}
/* Desktop approval corrections: keep the summary subordinate and balanced. */
.stat{padding-right:16px}
.stat+.stat{padding-left:16px}
.stat b{font-size:22px;line-height:1.2}
/* Keep the card-to-detail handoff visibly deliberate rather than stubby. */
.connector{height:64px;margin-top:0}
/* The selected agent and its icon already establish the AI context. */
.agent-label{display:none}
.work{height:364px}
.work-head{height:72px;align-items:center}
.result{padding:18px 24px}
.result-action{margin-top:12px;padding:12px 24px;justify-content:flex-start;gap:32px}
/* Give phase markers a deliberate breathing gap above the selectable cards. */
.agents{margin-top:20px}
/* Oboard md secondary action: compact and visually subordinate to the main CTA. */
.rerun{height:32px;padding:0 16px;border-radius:6px;border-color:#9eb8e2;color:#17356e;font-size:14px;font-weight:600}
/* Shared compact desktop rhythm: 24px shell, 16px relationships, 20px panel insets. */
.work{height:350px;padding:24px}
.work-grid{height:auto;min-height:170px;gap:16px}
.result,.summary{padding:20px}
.result h4{margin:16px 0 8px}
.stats{margin-top:auto}
.agent:hover{transform:none}
.agent{height:190px;padding:18px}
.agent-icon{margin-bottom:11px}
.agent h2{margin-bottom:8px}
.result{padding-bottom:20px}
.result-action{display:flex;margin-top:24px;padding:10px 16px;justify-content:space-between;gap:24px}
.result-action b{margin-left:auto;text-align:right}
.work{height:auto;min-height:306px}
/* The connector marker is the seam: half above, half inside the work shell. */
.connector:before{top:0;bottom:0}
.connector:after{width:18px;height:18px;border:2px solid #fff;box-shadow:0 0 0 4px #e7f0ff;bottom:-11px}
.page-switcher{position:fixed;z-index:20;right:18px;top:50%;display:grid;gap:6px;transform:translateY(-50%);padding:6px;border:1px solid #dbe7f8;border-radius:12px;background:rgba(255,255,255,.84);box-shadow:0 8px 24px rgba(20,51,97,.10);backdrop-filter:blur(8px)}.page-switcher a{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;color:#62708a;font-size:12px;font-weight:800;text-decoration:none}.page-switcher a:hover{background:#eaf2ff;color:#1268f3}.page-switcher a[aria-current="page"]{background:#1268f3;color:#fff}
</style>
<link rel="stylesheet" href="agent-illustrations.css?rev=optical-icons-3">
<style>
/* Shared editorial left detail: title, one paragraph, one marketing action. */
.work-copy .left-detail{margin:32px 0 0 76px;max-width:520px}
.work-copy .left-detail p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.work-copy .left-detail strong{color:var(--ink);font-weight:600}
.work-copy .left-cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:44px;margin-top:24px;padding:10px 24px;border-radius:8px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;line-height:1.5;text-decoration:none}
.work-copy .left-cta:hover{filter:brightness(.95)}
.work-copy .left-cta:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.work-copy .left-cta img{width:20px;height:20px;filter:brightness(0) invert(1)}
@media(max-width:540px){.work-copy .left-detail{margin-top:24px}.work-copy .left-cta{padding-inline:16px}}
</style>
</head>
<body>
<main class="page">
  <div class="brand">AI AGENTS</div>
  <h1 class="title">Keep <span>every cycle</span> moving.</h1>
  <p class="lede">AI agents that turn your work into progress — from preparation to a stronger close.</p>
  <section class="cycle" aria-label="AI agents across the operating cycle">
    <div class="phase-track" aria-hidden="true">
      <div class="phase"><span class="phase-num">01</span><span>Prepare</span><i class="phase-dot"></i></div>
      <div class="phase"><span class="phase-num">02</span><span>Plan</span><i class="phase-dot"></i></div>
      <div class="phase"><span class="phase-num">03</span><span>Run</span><i class="phase-dot"></i></div>
      <div class="phase"><span class="phase-num">04</span><span>Close</span><i class="phase-dot"></i></div>
    </div>
    <div class="agents" role="tablist" aria-label="Choose an AI agent">
      <button class="agent" role="tab" data-index="0" aria-selected="false"><span class="agent-icon"><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/file-description.svg" alt=""></span><h2>Strategy Readiness</h2><p>Pressure-test your strategy before it cascades.</p><span class="agent-tools" aria-label="Works with Google Docs, Oboard and AI"><img src="https://cdn.simpleicons.org/googledocs/4285F4" alt="" title="Google Docs"><img class="tool-oboard" src="card-icons/oboard-mark.svg" alt="" title="Oboard"><img class="tool-sparkle" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt="" title="AI"></span></button>
      <button class="agent" role="tab" data-index="1" aria-selected="false"><span class="agent-icon"><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/list-details.svg" alt=""></span><h2>OKR Drafting</h2><p>Turn parent goals into measurable team OKRs.</p><span class="agent-tools" aria-label="Works with Google Sheets, Oboard and AI"><img src="https://cdn.simpleicons.org/googlesheets/34A853" alt="" title="Google Sheets"><img class="tool-oboard" src="card-icons/oboard-mark.svg" alt="" title="Oboard"><img class="tool-sparkle" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt="" title="AI"></span></button>
      <button class="agent" role="tab" data-index="2" aria-selected="true"><span class="agent-icon"><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/target-arrow.svg" alt=""></span><h2>Alignment Analysis</h2><p>Find disconnected goals. Get a concrete fix.</p><span class="agent-tools" aria-label="Works with Oboard and AI"><img class="tool-oboard" src="card-icons/oboard-mark.svg" alt="" title="Oboard"><img class="tool-sparkle" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt="" title="AI"></span></button>
      <button class="agent" role="tab" data-index="3" aria-selected="false"><span class="agent-icon"><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/message-circle.svg" alt=""></span><h2>Check-in Drafting</h2><p>Turn work signals into an update you can confirm.</p><span class="agent-tools" aria-label="Works with Gmail, Google Calendar, Jira, Oboard and AI"><img src="https://cdn.simpleicons.org/gmail/EA4335" alt="" title="Gmail"><img src="https://cdn.simpleicons.org/googlecalendar/4285F4" alt="" title="Google Calendar"><img src="https://cdn.simpleicons.org/jira/0052CC" alt="" title="Jira"><img class="tool-oboard" src="card-icons/oboard-mark.svg" alt="" title="Oboard"><img class="tool-sparkle" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt="" title="AI"></span></button>
      <button class="agent" role="tab" data-index="4" aria-selected="false"><span class="agent-icon"><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/chart-bar.svg" alt=""></span><h2>Engagement Report</h2><p>See who is participating — and who went quiet.</p><span class="agent-tools" aria-label="Works with Slack, Oboard and AI"><img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/slack/slack-original.svg" alt="" title="Slack"><img class="tool-oboard" src="card-icons/oboard-mark.svg" alt="" title="Oboard"><img class="tool-sparkle" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt="" title="AI"></span></button>
      <button class="agent" role="tab" data-index="5" aria-selected="false"><span class="agent-icon"><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt=""></span><h2>Retrospective Prep</h2><p>Bring what moved, stalled and carries forward.</p><span class="agent-tools" aria-label="Works with Google Docs, Oboard and AI"><img src="https://cdn.simpleicons.org/googledocs/4285F4" alt="" title="Google Docs"><img class="tool-oboard" src="card-icons/oboard-mark.svg" alt="" title="Oboard"><img class="tool-sparkle" src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/sparkles.svg" alt="" title="AI"></span></button>
    </div>
    <div class="connector" aria-hidden="true"></div>
    <section class="work" aria-live="polite">
      <div class="work-copy"><header class="work-head">
        <div class="work-icon"><img id="workIcon" alt=""></div>
        <div class="work-title"><h3 id="workName"></h3><p id="workDesc"></p></div>
      </header>
      <div class="left-detail">
        <p><strong id="detailOpening"></strong> <span id="detailBody"></span></p>
        <a class="left-cta" id="detailCta" href="https://oboard.io/start-trial"><span id="detailCtaLabel"></span><img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/arrow-right.svg" alt=""></a>
      </div>
      </div><div id="agentIllustration" class="agent-illustration" role="img"></div>
    </section>
  </section>
  <footer class="footer"><span>Works within your permissions. Every draft stays under human control.</span><a href="#">Explore all agents&nbsp; →</a></footer>
 </main>
<nav class="page-switcher" aria-label="OBoard prototypes"><a href="agents-timeline.html" aria-current="page" aria-label="AI agents timeline">1</a><a href="platform-4-states.html" aria-label="Platform">2</a><a href="strategic-context.html" aria-label="Strategic context">3</a></nav>
<script src="agent-illustrations.js?rev=optical-icons-3"></script>
<script>
const iconBase='https://cdn.jsdelivr.net/npm/@tabler/icons@3.34.1/icons/outline/';
const agents=[
 {name:'Strategy Readiness',desc:'Pressure-test your strategy before it cascades.',icon:'file-description.svg'},
 {name:'OKR Drafting',desc:'Turn parent goals into measurable team OKRs.',icon:'list-details.svg'},
 {name:'Alignment Analysis',desc:'Find disconnected goals. Get a concrete fix.',icon:'target-arrow.svg'},
 {name:'Check-in Drafting',desc:'Turn work signals into an update you can confirm.',icon:'message-circle.svg'},
 {name:'Engagement Report',desc:'See who is participating — and who went quiet.',icon:'chart-bar.svg'},
 {name:'Retrospective Prep',desc:'Bring what moved, stalled and carries forward.',icon:'sparkles.svg'}
];
const tabs=[...document.querySelectorAll('.agent')],cycle=document.querySelector('.cycle'),phaseTrack=document.querySelector('.phase-track'),phaseDots=[...document.querySelectorAll('.phase-dot')];
const leftDetails=[
 {opening:'Find weak spots before they cascade into team OKRs.',body:'See which goals lack measurable targets, clear ownership or enough direction for teams to execute confidently. Fix the gaps before the next cycle starts.',cta:'Test strategy',subtitle:'Pressure-test your strategy before it cascades.'},
 {opening:'Turn strategic direction into OKRs your team can actually use.',body:'Start from parent goals, recent performance and team context to create measurable objectives and key results. Review the draft before anything is shared.',cta:'Draft OKRs'},
 {opening:'See where goals disconnect before execution starts.',body:'Trace objectives through the hierarchy, surface weak links and find goals that lack measurable outcomes. Get a concrete fix for the gaps that matter.',cta:'Check alignment',subtitle:'Find disconnected goals. Get a concrete fix.'},
 {opening:'Turn recent work into a check-in that is ready to review.',body:'Pull progress from the signals your team already creates, summarize what moved and surface what is blocked. Review the draft and confirm it when it looks right.',cta:'Draft check-in'},
 {opening:'Spot participation gaps before they become execution gaps.',body:'See who is updating their work, where activity is slowing and which owners may need a timely nudge. Focus attention without chasing the whole team.',cta:'Check engagement'},
 {opening:'Start the retrospective with the important signals already organized.',body:'Bring together outcomes, stalled work and unresolved dependencies from the completed cycle into a focused agenda. Carry the right context into what comes next.',cta:'Prepare retro'}
];
const refs={workIcon,workName,workDesc,detailOpening,detailBody,detailCtaLabel};
let selected=2;
function syncGeometry(index){const cycleRect=cycle.getBoundingClientRect(),tabRect=tabs[index].getBoundingClientRect(),trackRect=phaseTrack.getBoundingClientRect(),firstDot=phaseDots[0].getBoundingClientRect(),lastDot=phaseDots.at(-1).getBoundingClientRect();cycle.style.setProperty('--connector-x',`${tabRect.left+tabRect.width/2-cycleRect.left}px`);phaseTrack.style.setProperty('--line-start',`${firstDot.left+firstDot.width/2-trackRect.left}px`);phaseTrack.style.setProperty('--line-end',`${lastDot.left+lastDot.width/2-trackRect.left}px`)}
function render(index){const a=agents[index],detail=leftDetails[index];selected=index;tabs.forEach((t,i)=>t.setAttribute('aria-selected',String(i===index)));syncGeometry(index);refs.workIcon.src=iconBase+a.icon;refs.workName.textContent=a.name;refs.workDesc.textContent=detail.subtitle||a.desc;refs.detailOpening.textContent=detail.opening;refs.detailBody.textContent=detail.body;refs.detailCtaLabel.textContent=detail.cta;}
tabs.forEach((t,i)=>{t.addEventListener('mousedown',e=>e.preventDefault());t.addEventListener('click',()=>{const y=scrollY;render(i);requestAnimationFrame(()=>scrollTo(0,y));});});
addEventListener('resize',()=>syncGeometry(selected));
const renderOriginal=render;
render=function(index){renderOriginal(index);renderAgentIllustration(index);};
render(2);
</script>
</body>
